name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: API tests
        working-directory: apps/api
        env:
          USE_DATABASE: "false"
          AUTH_DISABLED: "true"
          JWT_SECRET: ci-secret
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: api-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install chromium --with-deps
      - name: Start API
        working-directory: apps/api
        env:
          USE_DATABASE: "false"
          AUTH_DISABLED: "true"
          USE_LOCAL_EXECUTION: "true"
          PORT: "3001"
        run: pnpm exec tsx src/index.ts &
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health && exit 0
            sleep 1
          done
          exit 1
      - name: E2E smoke
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: |
          pnpm exec next dev -p 3000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 1
          done
          E2E_SKIP_SERVER=1 npx playwright test

  api-mongo-smoke:
    runs-on: ubuntu-latest
    needs: api-test
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: Start API on Mongo
        working-directory: apps/api
        env:
          USE_DATABASE: mongo
          MONGODB_URL: mongodb://127.0.0.1:27017/flowguard-ci
          AUTH_DISABLED: "true"
          JWT_SECRET: ci-secret
          ADMIN_KEY: ci-admin-mongo
          USE_LOCAL_EXECUTION: "true"
          PORT: "3001"
        run: pnpm exec tsx src/index.ts &
      - name: Wait for API (Mongo)
        run: |
          for i in $(seq 1 30); do
            H=$(curl -sf http://localhost:3001/health || true)
            echo "$H" | grep -q '"database":"mongo"' && echo "API ready: $H" && exit 0
            sleep 1
          done
          exit 1
      - name: Mongo smoke
        run: node scripts/mongo-smoke.mjs
        env:
          API_URL: http://localhost:3001
          ADMIN_KEY: ci-admin-mongo

  docker-api:
    runs-on: ubuntu-latest
    needs: api-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t flowguard-api:ci .
