[deploy]
rootDirectory = "apps/api"
startCommand  = "pnpm exec tsx src/index.ts"
healthcheckPath = "/health"
healthcheckTimeout = 30

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

# Set ALL of these in the Railway dashboard (do not commit real secrets):
#   NODE_ENV=production
#   USE_DATABASE=mongo
#   MONGODB_URL=mongodb+srv://...
#   AUTH_DISABLED=false
#   JWT_SECRET=<long random>
#   ADMIN_KEY=<long random, not flowguard-admin>
#   CORS_ORIGINS=https://your-app.vercel.app
#   PUBLIC_URL=https://your-api.up.railway.app
# Optional:
#   REDIS_URL, SMTP_*, EMAIL_FROM, ARTIFACTS_DIR, S3_*, PLAYWRIGHT_GRID_URL
