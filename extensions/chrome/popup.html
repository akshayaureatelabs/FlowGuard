<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      button {
        width: 100%;
        margin-bottom: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
        background: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }
      button:disabled {
        opacity: 0.5;
      }
      .status {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 10px;
      }
      pre {
        max-height: 160px;
        overflow: auto;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 8px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>FlowGuard Recorder</h1>
    <div class="status" id="status">Idle</div>
    <button class="primary" id="start">Start recording</button>
    <button id="stop" disabled>Stop</button>
    <button id="copy">Copy steps JSON</button>
    <button id="clear">Clear</button>
    <pre id="out">[]</pre>
    <script src="popup.js"></script>
  </body>
</html>
