<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 14px;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .sub {
        font-size: 11px;
        color: #64748b;
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #334155;
        margin: 10px 0 3px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
        font-size: 12px;
        background: #fff;
      }
      button {
        width: 100%;
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
        background: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }
      button.green {
        background: #16a34a;
        color: #fff;
        border-color: #16a34a;
      }
      button.danger {
        background: #dc2626;
        color: #fff;
        border-color: #dc2626;
      }
      button:disabled {
        opacity: 0.5;
      }
      .status {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 4px;
      }
      .msg {
        font-size: 11px;
        margin-top: 8px;
        min-height: 14px;
      }
      .msg.ok {
        color: #16a34a;
      }
      .msg.err {
        color: #dc2626;
      }
      .auth-box {
        border-top: 1px solid #e2e8f0;
        margin-top: 12px;
        padding-top: 4px;
      }
      .signed-in {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #eef2ff;
        border: 1px solid #c7d2fe;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        color: #3730a3;
        margin-top: 10px;
      }
      .signed-in button {
        width: auto;
        margin: 0;
        padding: 2px 8px;
        font-size: 11px;
      }
      pre {
        max-height: 110px;
        overflow: auto;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 8px;
        font-size: 11px;
        margin-top: 10px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <h1>FlowGuard Recorder</h1>
    <div class="sub">Record browser actions, then push them into a cloud test.</div>

    <div class="status" id="status">Idle</div>
    <button class="primary" id="start">Start recording</button>
    <button id="stop" disabled>Stop</button>

    <div class="auth-box">
      <div class="signed-in" id="signedIn" style="display: none">
        <span id="signedInText">Signed in</span>
        <button class="danger" id="signOut">Sign out</button>
      </div>

      <label for="apiUrl">FlowGuard API URL</label>
      <input id="apiUrl" type="text" placeholder="http://localhost:3001" />

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@company.com" />

      <div class="row">
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" />
        </div>
        <div>
          <label for="apiKey">…or API key</label>
          <input id="apiKey" type="password" placeholder="x-api-key" />
        </div>
      </div>
      <button class="primary" id="signIn">Sign in / Refresh session</button>

      <div id="syncSection" style="display: none">
        <label for="projectSel">Project</label>
        <select id="projectSel">
          <option value="">— select project —</option>
        </select>

        <label for="testSel">Test (push target)</label>
        <select id="testSel">
          <option value="">— select test —</option>
        </select>

        <button class="green" id="push">Push steps to test</button>
      </div>
    </div>

    <button id="copy">Copy steps JSON</button>
    <button id="clear">Clear</button>

    <div class="msg" id="msg"></div>
    <pre id="out">[]</pre>
    <script src="popup.js"></script>
  </body>
</html>
